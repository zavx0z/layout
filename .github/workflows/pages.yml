name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: zavx0z/engine
          ref: 78c201fbda882356b93b08c4acdfabb8d33ad563
          path: .deps/engine
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Link Engine
        run: cd .deps/engine/packages/core && bun link
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: packages/storybook/pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
