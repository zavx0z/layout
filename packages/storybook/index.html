<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="description" content="Layout is a retained UI engine for immersive WebGPU interfaces, built for MetaFor.">
    <title>Layout — UI engine for WebGPU</title>
    <style>
      :root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,sans-serif;background:#0f1115;color:#edf2f7}
      *{box-sizing:border-box}body{margin:0;min-height:100vh;overflow:hidden;background:radial-gradient(circle at 50% 15%,#1c2a39,#0f1115 46%)}
      header{position:fixed;z-index:3;inset:0 0 auto;display:flex;align-items:center;gap:18px;padding:14px 18px;background:#15191fd9;border-bottom:1px solid #343b46;backdrop-filter:blur(14px)}
      header strong{font-size:15px}header span{color:#99a6b6;font-size:13px}header a{margin-left:auto;color:#72c7ff;text-decoration:none}
      nav{position:fixed;z-index:3;left:18px;bottom:18px;display:flex;gap:8px;padding:6px;background:#15191fe6;border:1px solid #343b46;border-radius:8px}
      button{border:1px solid #4b5665;border-radius:5px;background:#252c35;color:#edf2f7;padding:7px 12px;cursor:pointer}button[aria-pressed=true]{background:#315f78;border-color:#72c7ff}
      canvas{position:fixed;inset:0;width:100vw;height:100vh;touch-action:none}
      footer{position:fixed;z-index:3;right:18px;bottom:20px;color:#8491a1;font-size:12px}footer a{color:#72c7ff}
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <header><strong>Layout</strong><span>Retained UI engine for HUD and spatial displays</span><a href="https://github.com/zavx0z/metafor">Built for MetaFor ↗</a></header>
    <nav aria-label="Display mode"><button id="hud" aria-pressed="true">HUD</button><button id="space" aria-pressed="false">Space</button></nav>
    <footer><a href="https://github.com/zavx0z/metafor">Built for MetaFor</a> · <a href="https://github.com/zavx0z/layout">Source on GitHub</a></footer>
    <script type="module" src="./app.js"></script>
  </body>
</html>
